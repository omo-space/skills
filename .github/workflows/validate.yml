name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The omo.space release gate (R4) pushes new skill folders straight to
      # main without touching the README. Rebuild the index there so a new
      # skill is listed (under "Not yet categorised") instead of failing CI.
      - name: Rebuild index on main
        if: github.event_name == 'push'
        run: |
          python3 scripts/build_index.py
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: rebuild library index" README.md
            git push
          fi
      - run: python3 scripts/validate.py
